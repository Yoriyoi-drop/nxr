[package]
name = "nxrd"
version.workspace = true
edition.workspace = true

[dependencies]
nxr-core = { path = "../nxr-core" }
nxr-ql = { path = "../nxr-ql" }
nxr-api = { path = "../nxr-api" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
